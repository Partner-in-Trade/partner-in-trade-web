name: Profile Settings E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/settings-profile]

permissions:
  contents: read

jobs:
  profile-settings-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npx playwright test
